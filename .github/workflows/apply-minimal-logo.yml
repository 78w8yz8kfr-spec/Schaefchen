name: Minimale Firmenlogo-Anpassung

on:
  push:
    paths:
      - .github/workflows/apply-minimal-logo.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nur Registerfelder und Logo anpassen
        run: python .github/scripts/apply-minimal-logo.py
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js
          git commit -m "Registerfelder entfernen und Firmenlogo auswählbar machen"
          git push
